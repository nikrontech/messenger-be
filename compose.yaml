services:
  messenger-be:
    container_name: messenger-be
    build:
      context: ./messenger-be
    networks:
      - messenger

  messenger-fe:
    container_name: messenger-fe
    build:
      context: ./messenger-fe
    depends_on:
      - messenger-be
    environment:
      BACKEND_URL: http://messenger-be:3000
    ports:
      - "1220:80"
    networks:
      - messenger
      - home

networks:
  messenger:
    driver: bridge
  home:
    external: true
