services:
  messenger-be:
    container_name: messenger-be
    build:
      context: ./messenger-be
    networks:
      - messenger
      - home
    environment:
      DATABASE_URL: sqlite:///data/messages.db
    volumes:
      - messenger-data:/data

  messenger-fe:
    container_name: messenger-fe
    build:
      context: ./messenger-fe
    depends_on:
      - messenger-be
    environment:
      BACKEND_URL: http://messenger-be:3000
    networks:
      - messenger
      - home

networks:
  messenger:
    driver: bridge
  home:
    external: true

volumes:
  messenger-data:
